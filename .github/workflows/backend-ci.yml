name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "database/mysql/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "database/mysql/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: surfcasting
          MYSQL_ROOT_PASSWORD: root_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Install MySQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq default-mysql-client

      - name: Validate MySQL schema
        env:
          MYSQL_PWD: root_test
        run: mysql -h 127.0.0.1 -uroot < database/mysql/001_initial_schema.sql

      - name: Check Python syntax
        working-directory: backend
        run: python -m compileall -q app scripts

      - name: Run tests
        working-directory: backend
        env:
          TEST_MYSQL_URL: mysql+pymysql://root:root_test@127.0.0.1:3306/surfcasting?charset=utf8mb4
        run: pytest
