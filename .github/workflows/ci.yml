name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      API_URL: http://127.0.0.1:9
      NEXT_PUBLIC_API_URL: http://127.0.0.1:9
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package.json
      - run: npm install
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run build

  stack-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Prepare environment
        run: |
          cp backend/.env.example backend/.env
          cp deploy/.env.production.example deploy/.env.production
          sed -i 's/^JWT_SECRET=.*/JWT_SECRET=ci-only-secret-change-me-123456789/' backend/.env
          sed -i 's/^ADMIN_PASSWORD=.*/ADMIN_PASSWORD=CI-Test-Password-123!/' backend/.env
          sed -i 's/^SMTP_HOST=.*/SMTP_HOST=/' backend/.env
      - name: Validate development and production Compose
        run: |
          docker compose --profile app config --quiet
          docker compose --env-file deploy/.env.production -f docker-compose.production.yml config --quiet
      - name: Start stack
        run: docker compose --profile app up -d --build
      - name: Verify graph seed
        run: docker compose --profile app exec -T backend python scripts/verify_graph.py
      - name: Verify health, readiness and security headers
        run: |
          curl --fail --retry 15 --retry-delay 2 --retry-all-errors http://localhost:8000/health/live | grep -q '"status":"ok"'
          curl --fail --retry 15 --retry-delay 2 --retry-all-errors http://localhost:8000/health/ready | grep -q '"status":"ready"'
          curl --fail --silent --show-error -D - -o /dev/null http://localhost:8000/health/live | grep -qi '^x-content-type-options: nosniff'
          curl --fail --silent --show-error -D - -o /dev/null http://localhost:8000/health/live | grep -qi '^x-frame-options: DENY'
          curl --fail --silent --show-error -D - -o /dev/null http://localhost:8000/health/live | grep -qi '^content-security-policy:'
      - name: Verify backend and regional bootstrap data
        run: |
          docker compose --profile app exec -T backend python scripts/create_admin.py
          docker compose --profile app exec -T backend python scripts/seed_initial_data.py
          BEACHES_JSON=$(curl --fail --silent --show-error --retry 10 --retry-delay 2 http://localhost:8000/api/v1/beaches)
          printf '%s' "$BEACHES_JSON" | python3 -c 'import json,sys; rows=json.load(sys.stdin); slugs={row["slug"] for row in rows}; expected={"praia-de-itauna","praia-da-vila-saquarema","praia-de-jacone","praia-de-barra-nova-saquarema","praia-de-massambaba","praia-grande-arraial-do-cabo","praia-do-foguete","praia-do-pero"}; assert expected <= slugs, (expected-slugs)'
      - name: Verify HttpOnly authentication, CSRF and refresh rotation
        run: |
          AUTH_JSON=$(curl --fail --silent --show-error \
            -c cookies.txt \
            -H 'Content-Type: application/json' \
            -d '{"login":"admin@example.com","password":"CI-Test-Password-123!"}' \
            http://localhost:8000/api/v1/auth/login)
          printf '%s' "$AUTH_JSON" | python3 -c 'import json,sys; data=json.load(sys.stdin); assert data["user"]["role"] == "ADMIN"; assert data["user"]["email_verified"] is True; assert "access_token" not in data; assert "refresh_token" not in data'
          grep -q '#HttpOnly_.*srl_access' cookies.txt
          grep -q '#HttpOnly_.*srl_refresh' cookies.txt
          grep -q 'srl_csrf' cookies.txt

          curl --fail --silent --show-error -b cookies.txt http://localhost:8000/api/v1/auth/me | grep -q '"role":"ADMIN"'
          CSRF_TOKEN=$(awk '$6 == "srl_csrf" {print $7}' cookies.txt | tail -1)
          OLD_REFRESH=$(awk '$6 == "srl_refresh" {print $7}' cookies.txt | tail -1)
          test -n "$CSRF_TOKEN"
          test -n "$OLD_REFRESH"

          REFRESH_JSON=$(curl --fail --silent --show-error \
            -b cookies.txt -c cookies.txt -X POST \
            -H "X-CSRF-Token: $CSRF_TOKEN" \
            http://localhost:8000/api/v1/auth/refresh)
          printf '%s' "$REFRESH_JSON" | python3 -c 'import json,sys; data=json.load(sys.stdin); assert data["user"]["role"] == "ADMIN"; assert "access_token" not in data; assert "refresh_token" not in data'

          NEW_REFRESH=$(awk '$6 == "srl_refresh" {print $7}' cookies.txt | tail -1)
          test -n "$NEW_REFRESH"
          test "$NEW_REFRESH" != "$OLD_REFRESH"
          curl --fail --silent --show-error -b cookies.txt http://localhost:8000/api/v1/auth/me | grep -q '"role":"ADMIN"'

          OLD_REFRESH_BODY=$(OLD_REFRESH="$OLD_REFRESH" python3 -c 'import json,os; print(json.dumps({"refresh_token": os.environ["OLD_REFRESH"]}))')
          OLD_REFRESH_STATUS=$(curl --silent --output /dev/null --write-out '%{http_code}' -H 'Content-Type: application/json' -d "$OLD_REFRESH_BODY" http://localhost:8000/api/v1/auth/refresh)
          test "$OLD_REFRESH_STATUS" = "401"

          NO_CSRF_STATUS=$(curl --silent --output /dev/null --write-out '%{http_code}' -b cookies.txt -X POST http://localhost:8000/api/v1/auth/logout)
          test "$NO_CSRF_STATUS" = "403"
      - name: Verify frontend, PWA and SEO endpoints
        run: |
          set -euo pipefail
          echo '[web] login'
          curl -fsS --retry 15 --retry-delay 2 --retry-all-errors http://localhost:3000/login -o /dev/null
          echo '[web] praias'
          curl -fsS --retry 15 --retry-delay 2 --retry-all-errors http://localhost:3000/praias -o /dev/null
          echo '[pwa] manifest'
          curl -fsS http://localhost:3000/manifest.webmanifest -o /tmp/manifest.json
          python3 -c 'import json; data=json.load(open("/tmp/manifest.json", encoding="utf-8")); assert data["name"] == "Surfcasting Região dos Lagos"; assert data["display"] == "standalone"'
          echo '[pwa] service worker'
          curl -fsS http://localhost:3000/sw.js -o /tmp/sw.js
          grep -q 'srl-public-v1' /tmp/sw.js
          grep -q 'startsWith("/api/")' /tmp/sw.js
          echo '[seo] robots'
          curl -fsS -D /tmp/robots.headers http://localhost:3000/robots.txt -o /tmp/robots.txt
          test -s /tmp/robots.txt
          grep -qi '^content-type: text/plain' /tmp/robots.headers
          grep -q 'userAgent: "\*"' frontend/app/robots.ts
          grep -q 'disallow: \["/admin"' frontend/app/robots.ts
          grep -q 'sitemap:' frontend/app/robots.ts
          echo '[seo] sitemap'
          curl -fsS http://localhost:3000/sitemap.xml -o /tmp/sitemap.xml
          grep -q '<urlset' /tmp/sitemap.xml
          grep -q '/praias/praia-de-itauna' /tmp/sitemap.xml
      - name: Run concurrent load smoke
        run: python3 ops/load_test.py --base-url http://localhost:8000 --requests 200 --concurrency 20 --p95-ms 1500 --max-error-rate 0.01
      - name: Run browser E2E tests
        run: |
          npm --prefix frontend install
          cd frontend
          npx playwright install --with-deps chromium
          E2E_BASE_URL=http://localhost:3000 \
          E2E_ADMIN_EMAIL=admin@example.com \
          E2E_ADMIN_PASSWORD='CI-Test-Password-123!' \
          npm run test:e2e
      - name: Show service logs on failure
        if: failure()
        run: docker compose --profile app logs --no-color
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore
      - name: Stop stack
        if: always()
        run: docker compose --profile app down -v --remove-orphans
